name: Atualizar dados do Jira

on:
  schedule:
    - cron: "*/5 * * * *"    # a cada 5 min
  workflow_dispatch:          # botão "Run workflow"
  push:
    branches: [ main ]        # roda ao subir o repo

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Consultar Jira e atualizar data.json
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: node scripts/fetch-jira.mjs

      - name: Commit se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data.json)" ]; then
            git add data.json
            git commit -m "chore: atualiza dados do Jira [skip ci]"
            git push
          else
            echo "Sem mudanças no data.json"
          fi
